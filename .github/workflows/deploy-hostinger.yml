name: Deploy Hostinger production

on:
  workflow_run:
    workflows:
      - Quality gates
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostinger-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: hostinger-production
      url: https://smarteditor.bazarvan.com
    env:
      DEPLOY_COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
      HOSTINGER_SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
      HOSTINGER_SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT || '22' }}
      HOSTINGER_SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
      HOSTINGER_SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
      HOSTINGER_SSH_KNOWN_HOSTS: ${{ secrets.HOSTINGER_SSH_KNOWN_HOSTS }}
    steps:
      - name: Check out the verified commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.DEPLOY_COMMIT }}
          persist-credentials: false

      - name: Validate deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for secret_name in \
            HOSTINGER_SSH_HOST \
            HOSTINGER_SSH_USER \
            HOSTINGER_SSH_PRIVATE_KEY \
            HOSTINGER_SSH_KNOWN_HOSTS; do
            if [[ -z "${!secret_name:-}" ]]; then
              missing+=("${secret_name}")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required GitHub Actions secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi
          if [[ ! "${HOSTINGER_SSH_PORT}" =~ ^[0-9]+$ ]]; then
            echo 'HOSTINGER_SSH_PORT must be numeric.' >&2
            exit 1
          fi

      - name: Configure trusted SSH connection
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d "${HOME}/.ssh"
          printf '%s\n' "${HOSTINGER_SSH_PRIVATE_KEY}" | tr -d '\r' > "${HOME}/.ssh/hostinger_deploy"
          chmod 600 "${HOME}/.ssh/hostinger_deploy"
          printf '%s\n' "${HOSTINGER_SSH_KNOWN_HOSTS}" | tr -d '\r' > "${HOME}/.ssh/known_hosts"
          chmod 600 "${HOME}/.ssh/known_hosts"

      - name: Deploy verified commit to Hostinger
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -i "${HOME}/.ssh/hostinger_deploy" \
            -p "${HOSTINGER_SSH_PORT}" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            "${HOSTINGER_SSH_USER}@${HOSTINGER_SSH_HOST}" \
            "HOSTINGER_DEPLOY_PATH='/var/www/bazarvan-editor-staging' DEPLOY_BRANCH='main' DEPLOY_COMMIT='${DEPLOY_COMMIT}' bash -s" \
            < deploy/deploy-hostinger-production.sh
